<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Gym Tracker - SAI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app">
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="today">
                <span class="nav-icon">🏋️</span>
                <span class="nav-label">Today</span>
            </button>
            <button class="nav-btn" data-view="calendar">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Calendar</span>
            </button>
        </nav>

        <!-- Today View -->
        <div class="view active" id="today-view">
            <!-- Date Header -->
            <header class="header">
                <div class="date-display">
                    <h1 class="current-date">Today</h1>
                    <p class="full-date">December 31, 2024</p>
                </div>
                <div class="progress-ring">
                    <span class="progress-text">0/0</span>
                </div>
            </header>

            <!-- Workout Type Selector -->
            <div class="workout-selector">
                <p class="selector-label">Choose your workout</p>
                <div class="workout-type-buttons">
                    <button class="type-btn" data-type="upper">
                        <span class="type-icon">💪</span>
                        <span class="type-name">Upper Body</span>
                    </button>
                    <button class="type-btn" data-type="lower">
                        <span class="type-icon">🦵</span>
                        <span class="type-name">Lower Body</span>
                    </button>
                    <button class="type-btn" data-type="core">
                        <span class="type-icon">🎯</span>
                        <span class="type-name">Core</span>
                    </button>
                </div>
            </div>

            <!-- Workout Content (shown after selecting type) -->
            <div class="workout-content" id="workout-content">
                <!-- Workouts will be injected here -->
            </div>

            <!-- Reset Button -->
            <button class="reset-btn" id="reset-day">
                Reset Today's Progress
            </button>
        </div>

        <!-- Calendar View -->
        <div class="view" id="calendar-view">
            <header class="header calendar-header">
                <button class="month-nav" id="prev-month">‹</button>
                <h1 class="month-title">December 2024</h1>
                <button class="month-nav" id="next-month">›</button>
            </header>

            <div class="calendar-container">
                <div class="calendar-weekdays">
                    <span>Sun</span>
                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                </div>
                <div class="calendar-days" id="calendar-days">
                    <!-- Calendar days will be injected here -->
                </div>
            </div>

            <!-- Selected Day Summary -->
            <div class="day-summary" id="day-summary">
                <p class="summary-placeholder">Tap a day to view workout details</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Edit Exercise</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-exercise-info">
                    <div class="modal-illustration"></div>
                    <div class="modal-exercise-details">
                        <h3 class="modal-exercise-name"></h3>
                        <p class="modal-exercise-desc"></p>
                    </div>
                </div>
                <div class="modal-tracking">
                    <h3>Track Your Sets</h3>
                    <div class="sets-container">
                        <div class="set-input">
                            <label>Set 1</label>
                            <input type="number" class="reps-input" data-set="1" placeholder="Reps" min="0" max="50">
                        </div>
                        <div class="set-input">
                            <label>Set 2</label>
                            <input type="number" class="reps-input" data-set="2" placeholder="Reps" min="0" max="50">
                        </div>
                        <div class="set-input">
                            <label>Set 3</label>
                            <input type="number" class="reps-input" data-set="3" placeholder="Reps" min="0" max="50">
                        </div>
                    </div>
                    <div class="comment-section">
                        <label>Notes (optional)</label>
                        <textarea class="comment-input" placeholder="How did it feel? Any adjustments?"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-save">Save</button>
            </div>
        </div>
    </div>

    <!-- Exercise Info Modal -->
    <div class="modal" id="info-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Exercise Info</h2>
                <button class="modal-close info-close">&times;</button>
            </div>
            <div class="modal-body">
                <!-- Video Section -->
                <div class="video-section">
                    <div class="video-container" id="video-container">
                        <!-- YouTube iframe will be inserted here -->
                    </div>
                    <p class="video-source">Video source: <span id="video-source-name"></span></p>
                </div>

                <!-- Step by Step Guide -->
                <div class="info-section steps-section">
                    <h3>Step-by-Step Guide</h3>
                    <ol class="steps-list" id="steps-list">
                        <!-- Steps will be inserted here -->
                    </ol>
                </div>

                <div class="modal-info">
                    <div class="info-section">
                        <h3>Target Muscles</h3>
                        <div class="muscle-tags"></div>
                    </div>
                    <div class="info-section equipment-section">
                        <h3>Equipment</h3>
                        <div class="equipment-info">
                            <p class="equipment-name"></p>
                            <p class="equipment-brand"></p>
                            <p class="equipment-desc"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary info-close-btn">Got it</button>
            </div>
        </div>
    </div>

    <script src="workouts.js"></script>
    <script src="app.js"></script>
</body>
</html>
